name: Release binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Install dependencies
        run: |
          npm install
          npm --prefix backend install
          npm --prefix frontend install

      - name: Build binaries
        run: npm run dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/NewsCatcher-linux-x64.zip
            release/NewsCatcher-linux-arm64.zip
            release/NewsCatcher-macos-x64.zip
            release/NewsCatcher-macos-arm64.zip
            release/NewsCatcher-windows-x64.zip
          generate_release_notes: true
